; XIAO ESP32S3 用(GUIDE01 との BLE)。
; platform / NimBLE のバージョンと link_prebuilt.py の使い方は、SDK の esp32/examples/full_demo/platformio.ini に合わせた
; (sdk/guide01 @ 783d69f)。NimBLE-Arduino は 2.x だと API が違うため ^1.4.2 に固定する。
; board = seeed_xiao_esp32s3 は PlatformIO の board 名(公式 Wiki での確認は docs/FINDINGS.md S6 を参照)。

[platformio]
src_dir = src

[env:xiao_esp32s3]
platform = espressif32 @ ^6.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
extra_scripts = pre:link_prebuilt.py
