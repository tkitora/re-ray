; 雛形(要検証)。Seeed の XIAO ESP32S3 公式資料と、GUIDE01 SDK の esp32/ サンプルの設定に合わせて直すこと。
; GUIDE01 SDK のビルド済みライブラリ(libs/esp32/esp32s3/...)のリンク方法は SDK の README に従う。

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino
