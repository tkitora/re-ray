; T-Beam V1.2(AXP2101)用。公式 LilyGo-LoRa-Series(コミット 1991b1e)の platformio.ini と突き合わせて直した。
;  - board = esp32dev は公式と同じ。PSRAM の指定とパーティション(huge_app.csv)は公式に合わせて追加した
;  - ライブラリは公式が lib/ に同梱している版(RadioLib 7.8.1、TinyGPSPlus 1.0.2、XPowersLib 0.2.6)に固定した
;  - 公式の周波数・出力(920.0MHz、17dBm)は使わない。ここの値と tx_guard.h が優先(docs/COMPLIANCE.md)
; ピンは docs/PINMAP.md。実機未確認(ビルドのみ確認)。

[env:tbeam]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
    -DT_BEAM_SX1276
    -DRERAY_TX_ENABLE=0        ; 規制の確認が済むまで 0(送信しない)
    -DRERAY_MAX_TX_DBM=12      ; 上限。12 を超えない
    -DRERAY_TX_DBM=10          ; 初期設定
lib_deps =
    jgromes/RadioLib @ 7.8.1
    mikalhart/TinyGPSPlus @ 1.0.2
    lewisxhe/XPowersLib @ 0.2.6
    knolleary/PubSubClient
