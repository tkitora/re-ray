; 雛形(要検証)。LILYGO 公式 LilyGo-LoRa-Series の platformio.ini と突き合わせて直すこと。
; T-Beam V1.2(AXP2101)の環境設定、パーティション、PSRAM の指定は公式に従う。

[env:tbeam]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DRERAY_TX_ENABLE=0        ; 規制の確認が済むまで 0(送信しない)
    -DRERAY_MAX_TX_DBM=12      ; 上限。12 を超えない
    -DRERAY_TX_DBM=10          ; 初期設定
lib_deps =
    jgromes/RadioLib
    mikalhart/TinyGPSPlus
    lewisxhe/XPowersLib
    knolleary/PubSubClient
